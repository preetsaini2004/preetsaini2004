<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title"><title id="title">AI leads, with ethical hacking, networking, and games as supporting interests.</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30424e" opacity=".45"/></pattern><radialGradient id="halo"><stop stop-color="#83d8d0" stop-opacity=".12"/><stop offset="1" stop-color="#83d8d0" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:12 430;animation:flow 15s linear infinite}.breathe{animation:breathe 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-884}}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.breathe{animation:none}}</style><rect width="1200" height="365" rx="20" fill="#101820"/><text x="40" y="45" font-size="15" fill="#83d8d0" font-family="Consolas, 'Courier New', monospace" letter-spacing="1.3" >02 / THE FOUNDATION</text><text x="40" y="97" font-size="40" fill="#edf1ed" font-weight="700">Same curiosity. New frontier.</text><text x="40" y="140" font-size="22" fill="#adbdc6" >AI is the main focus. These interests still shape how I explore technology.</text><rect x="40" y="186" width="360" height="133" rx="12" fill="#101820" stroke="#30424e"/><text x="64" y="216" font-size="13" fill="#efb67c" font-family="Consolas, 'Courier New', monospace" letter-spacing="1.3" >SECURITY</text><text x="64" y="254" font-size="27" fill="#edf1ed" font-weight="700">Ethical hacking</text><text x="64" y="289" font-size="19" fill="#adbdc6" >Looking beneath the interface.</text><rect x="420" y="186" width="360" height="133" rx="12" fill="#101820" stroke="#30424e"/><text x="444" y="216" font-size="13" fill="#efb67c" font-family="Consolas, 'Courier New', monospace" letter-spacing="1.3" >CONNECTIONS</text><text x="444" y="254" font-size="27" fill="#edf1ed" font-weight="700">Networking</text><text x="444" y="289" font-size="19" fill="#adbdc6" >Thinking in connected systems.</text><rect x="800" y="186" width="360" height="133" rx="12" fill="#101820" stroke="#30424e"/><text x="824" y="216" font-size="13" fill="#efb67c" font-family="Consolas, 'Courier New', monospace" letter-spacing="1.3" >PLAY</text><text x="824" y="254" font-size="27" fill="#edf1ed" font-weight="700">Games</text><text x="824" y="289" font-size="19" fill="#adbdc6" >Exploring interactive worlds.</text></svg>