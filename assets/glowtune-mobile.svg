<svg xmlns="http://www.w3.org/2000/svg" width="600" height="790" viewBox="0 0 600 790" role="img" aria-labelledby="title"><title id="title">Now playing: Glowtune. An open-source Windows app that lights your screen edges in the album's colors, syncs lyrics word by word, and turns your desktop into a live music scene. About 130 MB of RAM and 1–2% CPU.</title><defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efb67c"/><stop offset=".55" stop-color="#e9c07a"/><stop offset="1" stop-color="#83d8d0"/></linearGradient><linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efb67c"/><stop offset="1" stop-color="#3a8f88"/></linearGradient><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter></defs><style>text{font-family:Arial,Helvetica,sans-serif}.m,.m text{font-family:Consolas,'Courier New',monospace;letter-spacing:1.3px}.glow{animation:glow 4.8s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}.line{animation:line 4.8s ease-in-out infinite}@keyframes line{0%,100%{fill:#edf1ed}50%{fill:#f6d3a6}}@media(prefers-reduced-motion:reduce){.glow,.line{animation:none}}</style><rect width="600" height="790" rx="20" fill="#101820"/><text class="m" x="40" y="45" font-size="15" fill="#83d8d0">05 / NOW PLAYING</text><text x="40" y="95" font-size="34" fill="#edf1ed" font-weight="700">Your music,</text><text x="40" y="135" font-size="32" fill="#83d8d0" font-family="Georgia,serif" font-style="italic">all over your screen.</text><rect x="40" y="166" width="520" height="300" rx="16" fill="#16222c" stroke="#30424e"/><text class="m" x="64" y="202" font-size="13" fill="#efb67c">FEATURED BUILD</text><text class="m" x="536" y="202" font-size="12" fill="#adbdc6" text-anchor="end">RUST · TAURI · SVELTE</text><text x="64" y="248" font-size="32" fill="#edf1ed" font-weight="700">Glowtune</text><text x="64" y="282" font-size="17" fill="#adbdc6">Lights your screen edges in the album's</text><text x="64" y="306" font-size="17" fill="#adbdc6">colors, syncs lyrics word by word, and</text><text x="64" y="330" font-size="17" fill="#adbdc6">turns your desktop into a live scene.</text><g class="m" font-size="14"><rect x="64" y="354" width="98" height="32" rx="16" fill="#101820" stroke="#83d8d0" stroke-opacity=".6"/><text x="113" y="375" fill="#83d8d0" text-anchor="middle">GLOW</text><rect x="174" y="354" width="108" height="32" rx="16" fill="#101820" stroke="#83d8d0" stroke-opacity=".6"/><text x="228" y="375" fill="#83d8d0" text-anchor="middle">LYRICS</text><rect x="294" y="354" width="98" height="32" rx="16" fill="#101820" stroke="#83d8d0" stroke-opacity=".6"/><text x="343" y="375" fill="#83d8d0" text-anchor="middle">SCENE</text></g><text class="m" x="64" y="432" font-size="14" fill="#edf1ed">↓ Download for Windows</text><text class="m" x="536" y="432" font-size="12" fill="#adbdc6" text-anchor="end">~130 MB · 1–2% CPU</text><rect x="40" y="490" width="520" height="262" rx="16" fill="#16222c" stroke="#30424e"/><text class="m" x="64" y="526" font-size="13" fill="#efb67c">EDGE GLOW + SYNCED LYRICS</text><g transform="translate(72 550)"><rect class="glow" x="0" y="0" width="456" height="176" rx="12" fill="none" stroke="url(#edge)" stroke-width="14" filter="url(#soft)"/><rect x="0" y="0" width="456" height="176" rx="12" fill="#0b1117" stroke="url(#edge)" stroke-width="2"/><text x="28" y="56" font-size="34" fill="none" stroke="#efb67c" stroke-width="1.3" font-weight="700">9:24</text><rect x="28" y="78" width="66" height="66" rx="8" fill="url(#art)"/><circle cx="61" cy="111" r="16" fill="#101820" fill-opacity=".35"/><text x="122" y="70" font-size="14" fill="#adbdc6" fill-opacity=".55">Neon rain on the window</text><text class="line" x="122" y="100" font-size="17" fill="#edf1ed" font-weight="700">Every little light holds still</text><text x="122" y="130" font-size="14" fill="#adbdc6" fill-opacity=".55">The city folds into blue</text><rect x="122" y="152" width="300" height="3" rx="1.5" fill="#30424e"/><rect x="122" y="152" width="128" height="3" rx="1.5" fill="#efb67c"/></g></svg>
