<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title"><title id="title">Shipped and reported. TraceLeakCheck: an open-source tool that catches secrets leaking through an AI app's OpenTelemetry. Reported OpenTelemetry bug opentelemetry-python-contrib #5279: S3 presigned URLs leaked their signature and session token into traces.</title><defs><radialGradient id="halo"><stop stop-color="#83d8d0" stop-opacity=".14"/><stop offset="1" stop-color="#83d8d0" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.m,.m text{font-family:Consolas,'Courier New',monospace;letter-spacing:1.3px}.breathe{animation:breathe 6s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.breathe{animation:none}}</style><rect width="1200" height="430" rx="20" fill="#101820"/><text class="m" x="40" y="45" font-size="15" fill="#83d8d0">04 / SHIPPED &amp; REPORTED</text><text class="m" x="1160" y="45" font-size="13" fill="#efb67c" text-anchor="end">OPEN SOURCE</text><text x="40" y="96" font-size="38" fill="#edf1ed" font-weight="700">Built it. Used it. <tspan font-family="Georgia,serif" font-style="italic" font-weight="400" fill="#83d8d0">Found a real bug.</tspan></text><rect x="40" y="128" width="640" height="262" rx="16" fill="#16222c" stroke="#30424e"/><circle cx="600" cy="200" r="120" fill="url(#halo)"/><text class="m" x="66" y="165" font-size="13" fill="#efb67c">FEATURED BUILD</text><text class="m" x="654" y="165" font-size="13" fill="#adbdc6" text-anchor="end">PYTHON · PYPI</text><text x="66" y="212" font-size="34" fill="#edf1ed" font-weight="700">TraceLeakCheck</text><text x="66" y="248" font-size="18" fill="#adbdc6">Plants a fake secret in your AI app, captures everything</text><text x="66" y="274" font-size="18" fill="#adbdc6">it exports, and shows exactly where the secret leaked.</text><g class="m" font-size="14"><rect x="66" y="298" width="98" height="32" rx="16" fill="#101820" stroke="#83d8d0" stroke-opacity=".6"/><text x="115" y="319" fill="#83d8d0" text-anchor="middle">FIND</text><rect x="176" y="298" width="90" height="32" rx="16" fill="#101820" stroke="#83d8d0" stroke-opacity=".6"/><text x="221" y="319" fill="#83d8d0" text-anchor="middle">FIX</text><rect x="278" y="298" width="108" height="32" rx="16" fill="#101820" stroke="#83d8d0" stroke-opacity=".6"/><text x="332" y="319" fill="#83d8d0" text-anchor="middle">PROVE</text></g><text class="m" x="66" y="366" font-size="14" fill="#edf1ed">$ pip install traceleakcheck</text><text class="m" x="654" y="366" font-size="13" fill="#adbdc6" text-anchor="end">ANY LANGUAGE · OTLP</text><rect x="704" y="128" width="456" height="262" rx="16" fill="#16222c" stroke="#30424e"/><circle class="breathe" cx="1124" cy="160" r="6" fill="#ef8a7a"/><text class="m" x="730" y="165" font-size="13" fill="#efb67c">FOUND &amp; REPORTED</text><text class="m" x="730" y="208" font-size="17" fill="#83d8d0">opentelemetry-python-contrib</text><text x="730" y="248" font-size="34" fill="#edf1ed" font-weight="700">#5279</text><text x="730" y="284" font-size="17" fill="#adbdc6">S3 presigned URLs leaked their signature</text><text x="730" y="308" font-size="17" fill="#adbdc6">and session token into traces: three</text><text x="730" y="332" font-size="17" fill="#adbdc6">X-Amz keys missing from the redaction list.</text><text class="m" x="730" y="366" font-size="13" fill="#edf1ed">FOUND WITH MY OWN TOOL ↗</text></svg>
