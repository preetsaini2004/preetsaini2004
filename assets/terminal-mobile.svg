<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title"><title id="title">Field work: a TraceLeakCheck run. The app leaks an OpenAI key in 15 places; through the redaction Collector the result is clean.</title><style>text{font-family:Arial,Helvetica,sans-serif}.m,.m text{font-family:Consolas,'Courier New',monospace;letter-spacing:.3px}.ln{opacity:0;animation:show 16s linear infinite}.cur{animation:blink 1s steps(1) infinite}.l2{animation-delay:1.2s}.l3{animation-delay:2.4s}.l4{animation-delay:5.2s}.l5{animation-delay:6.4s}.l6{animation-delay:8.2s}.l7{animation-delay:9.4s}@keyframes show{0%{opacity:0}2%{opacity:1}74%{opacity:1}78%,100%{opacity:0}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.ln{opacity:1;animation:none}.cur{animation:none}}</style><rect width="600" height="600" rx="20" fill="#101820"/><text class="m" x="40" y="45" font-size="15" fill="#83d8d0" letter-spacing="1.3">03 / FIELD WORK</text><text class="m" x="560" y="45" font-size="13" fill="#efb67c" letter-spacing="1.3" text-anchor="end">LIVE RUN</text><text x="40" y="95" font-size="34" fill="#edf1ed" font-weight="700">Catching secrets</text><text x="40" y="135" font-size="34" fill="#edf1ed" font-weight="700">before they ship.</text><rect x="40" y="166" width="520" height="400" rx="14" fill="#0b1218" stroke="#30424e"/><path d="M40 204L560 204" stroke="#30424e"/><circle cx="64" cy="185" r="5.5" fill="#30424e"/><circle cx="84" cy="185" r="5.5" fill="#30424e"/><circle cx="104" cy="185" r="5.5" fill="#30424e"/><text class="m" x="300" y="190" font-size="13" fill="#adbdc6" text-anchor="middle">~/lab — bash</text><g font-size="15" class="m"><text x="62" y="240"><tspan fill="#83d8d0">$</tspan><tspan fill="#edf1ed"> traceleakcheck run \</tspan></text><text x="96" y="262" fill="#edf1ed">-- node agent.js</text><text class="ln l2" x="76" y="294" fill="#adbdc6">planted a fake key…</text><g class="ln l3"><rect x="76" y="306" width="130" height="24" rx="5" fill="#3a1f20"/><text x="86" y="323" fill="#ef8a7a" font-weight="700">✖ LEAK FOUND</text><text x="76" y="352" fill="#edf1ed">OpenAI key leaked in <tspan fill="#ef8a7a" font-weight="700">15 places</tspan></text></g><text class="ln l4" x="62" y="394"><tspan fill="#83d8d0">$</tspan><tspan fill="#edf1ed"> # through the Collector</tspan></text><text class="ln l5" x="62" y="420"><tspan fill="#83d8d0">$</tspan><tspan fill="#edf1ed"> traceleakcheck run …</tspan></text><g class="ln l6"><rect x="76" y="434" width="88" height="24" rx="5" fill="#16302e"/><text x="86" y="451" fill="#83d8d0" font-weight="700">✔ CLEAN</text><text x="76" y="480" fill="#edf1ed">secrets stayed out of</text><text x="76" y="502" fill="#edf1ed">the monitoring data</text></g><g class="ln l7"><text x="62" y="540" fill="#83d8d0">$</text><rect class="cur" x="78" y="527" width="9" height="16" fill="#efb67c"/></g></g></svg>
