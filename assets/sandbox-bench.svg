<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title"><title id="title">Research: sandbox-bench. An open attack benchmark for the sandboxes that contain AI coding agents. In their default setup, Docker, gVisor, nono, Firecracker and E2B let a secret out over HTTP; OpenShell blocked it. Prompt injection: 0 of 33 runs where Claude Code, Codex or opencode obeyed a hidden instruction, even with refusals removed.</title><defs><radialGradient id="halo"><stop stop-color="#ef8a7a" stop-opacity=".12"/><stop offset="1" stop-color="#ef8a7a" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.m,.m text{font-family:Consolas,'Courier New',monospace;letter-spacing:1.3px}.breathe{animation:breathe 6s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.breathe{animation:none}}</style><rect width="1200" height="430" rx="20" fill="#101820"/><text class="m" x="40" y="45" font-size="15" fill="#83d8d0">05 / RESEARCH</text><text class="m" x="1160" y="45" font-size="13" fill="#efb67c" text-anchor="end">OPEN BENCHMARK</text><text x="40" y="96" font-size="38" fill="#edf1ed" font-weight="700">Attacked six sandboxes. <tspan font-family="Georgia,serif" font-style="italic" font-weight="400" fill="#83d8d0">Watched what got out.</tspan></text><rect x="40" y="128" width="640" height="262" rx="16" fill="#16222c" stroke="#30424e"/><circle cx="600" cy="200" r="120" fill="url(#halo)"/><text class="m" x="66" y="165" font-size="13" fill="#efb67c">FEATURED RESEARCH</text><text class="m" x="654" y="165" font-size="13" fill="#adbdc6" text-anchor="end">PYTHON · KVM TEST VM</text><text x="66" y="212" font-size="34" fill="#edf1ed" font-weight="700">sandbox-bench</text><text x="66" y="248" font-size="18" fill="#adbdc6">Runs real attacks inside the sandboxes that contain AI</text><text x="66" y="274" font-size="18" fill="#adbdc6">coding agents, and scores what actually gets out.</text><text class="m" x="115" y="306" font-size="12" fill="#adbdc6" text-anchor="middle">Docker</text><circle class="breathe" cx="115" cy="326" r="7" fill="#ef8a7a"/><text class="m" x="213" y="306" font-size="12" fill="#adbdc6" text-anchor="middle">gVisor</text><circle class="breathe" cx="213" cy="326" r="7" fill="#ef8a7a"/><text class="m" x="311" y="306" font-size="12" fill="#adbdc6" text-anchor="middle">nono</text><circle class="breathe" cx="311" cy="326" r="7" fill="#ef8a7a"/><text class="m" x="409" y="306" font-size="12" fill="#adbdc6" text-anchor="middle">OpenShell</text><circle cx="409" cy="326" r="7" fill="#83d8d0"/><text class="m" x="507" y="306" font-size="12" fill="#adbdc6" text-anchor="middle">Firecracker</text><circle class="breathe" cx="507" cy="326" r="7" fill="#ef8a7a"/><text class="m" x="605" y="306" font-size="12" fill="#adbdc6" text-anchor="middle">E2B</text><circle class="breathe" cx="605" cy="326" r="7" fill="#ef8a7a"/><text class="m" x="66" y="366" font-size="13" fill="#edf1ed">SECRET OUT OVER HTTP · DEFAULTS</text><text class="m" x="654" y="366" font-size="13" fill="#adbdc6" text-anchor="end"><tspan fill="#ef8a7a">●</tspan> LEAKED  <tspan fill="#83d8d0">●</tspan> BLOCKED</text><rect x="704" y="128" width="456" height="262" rx="16" fill="#16222c" stroke="#30424e"/><circle class="breathe" cx="1124" cy="160" r="6" fill="#83d8d0"/><text class="m" x="730" y="165" font-size="13" fill="#efb67c">PROMPT INJECTION</text><text class="m" x="730" y="208" font-size="17" fill="#83d8d0">4 real coding agents</text><text x="730" y="248" font-size="34" fill="#edf1ed" font-weight="700">0 / 33</text><text x="730" y="284" font-size="17" fill="#adbdc6">runs where an agent obeyed a hidden</text><text x="730" y="308" font-size="17" fill="#adbdc6">instruction: Claude Code, Codex and</text><text x="730" y="332" font-size="17" fill="#adbdc6">opencode, even with refusals removed.</text><text class="m" x="730" y="366" font-size="13" fill="#edf1ed">THE NETWORK LEAKS, NOT THE MODEL ↗</text></svg>