<svg xmlns="http://www.w3.org/2000/svg" width="600" height="830" viewBox="0 0 600 830" role="img" aria-labelledby="title"><title id="title">Research: sandbox-bench. An open attack benchmark for the sandboxes that contain AI coding agents. In their default setup, Docker, gVisor, nono, Firecracker and E2B let a secret out over HTTP; OpenShell blocked it. Prompt injection: 0 of 33 runs where Claude Code, Codex or opencode obeyed a hidden instruction, even with refusals removed.</title><defs><radialGradient id="halo"><stop stop-color="#ef8a7a" stop-opacity=".12"/><stop offset="1" stop-color="#ef8a7a" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.m,.m text{font-family:Consolas,'Courier New',monospace;letter-spacing:1.3px}.breathe{animation:breathe 6s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.breathe{animation:none}}</style><rect width="600" height="830" rx="20" fill="#101820"/><text class="m" x="40" y="45" font-size="15" fill="#83d8d0">05 / RESEARCH</text><text x="40" y="95" font-size="34" fill="#edf1ed" font-weight="700">Attacked six sandboxes.</text><text x="40" y="135" font-size="32" fill="#83d8d0" font-family="Georgia,serif" font-style="italic">Watched what got out.</text><rect x="40" y="166" width="520" height="340" rx="16" fill="#16222c" stroke="#30424e"/><circle cx="470" cy="260" r="110" fill="url(#halo)"/><text class="m" x="64" y="202" font-size="13" fill="#efb67c">FEATURED RESEARCH</text><text class="m" x="536" y="202" font-size="12" fill="#adbdc6" text-anchor="end"><tspan fill="#ef8a7a">●</tspan> LEAKED  <tspan fill="#83d8d0">●</tspan> BLOCKED</text><text x="64" y="248" font-size="32" fill="#edf1ed" font-weight="700">sandbox-bench</text><text x="64" y="282" font-size="17" fill="#adbdc6">Runs real attacks inside the sandboxes</text><text x="64" y="306" font-size="17" fill="#adbdc6">that contain AI coding agents, and</text><text x="64" y="330" font-size="17" fill="#adbdc6">scores what actually gets out.</text><text class="m" x="143" y="368" font-size="12" fill="#adbdc6" text-anchor="middle">Docker</text><circle class="breathe" cx="143" cy="388" r="7" fill="#ef8a7a"/><text class="m" x="300" y="368" font-size="12" fill="#adbdc6" text-anchor="middle">gVisor</text><circle class="breathe" cx="300" cy="388" r="7" fill="#ef8a7a"/><text class="m" x="457" y="368" font-size="12" fill="#adbdc6" text-anchor="middle">nono</text><circle class="breathe" cx="457" cy="388" r="7" fill="#ef8a7a"/><text class="m" x="143" y="418" font-size="12" fill="#adbdc6" text-anchor="middle">OpenShell</text><circle cx="143" cy="438" r="7" fill="#83d8d0"/><text class="m" x="300" y="418" font-size="12" fill="#adbdc6" text-anchor="middle">Firecracker</text><circle class="breathe" cx="300" cy="438" r="7" fill="#ef8a7a"/><text class="m" x="457" y="418" font-size="12" fill="#adbdc6" text-anchor="middle">E2B</text><circle class="breathe" cx="457" cy="438" r="7" fill="#ef8a7a"/><text class="m" x="64" y="480" font-size="13" fill="#edf1ed">SECRET OUT OVER HTTP · DEFAULTS</text><rect x="40" y="530" width="520" height="262" rx="16" fill="#16222c" stroke="#30424e"/><circle class="breathe" cx="530" cy="561" r="6" fill="#83d8d0"/><text class="m" x="64" y="566" font-size="13" fill="#efb67c">PROMPT INJECTION</text><text class="m" x="64" y="608" font-size="16" fill="#83d8d0">4 real coding agents</text><text x="64" y="648" font-size="32" fill="#edf1ed" font-weight="700">0 / 33</text><text x="64" y="684" font-size="17" fill="#adbdc6">runs where an agent obeyed a hidden</text><text x="64" y="708" font-size="17" fill="#adbdc6">instruction: Claude Code, Codex and</text><text x="64" y="732" font-size="17" fill="#adbdc6">opencode, even with refusals removed.</text><text class="m" x="64" y="768" font-size="13" fill="#edf1ed">THE NETWORK LEAKS, NOT THE MODEL ↗</text></svg>