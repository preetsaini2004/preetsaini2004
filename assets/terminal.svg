<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title"><title id="title">Field work: a TraceLeakCheck run. The app leaks an OpenAI key in 15 places; through the redaction Collector the result is clean.</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30424e" opacity=".45"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.m,.m text{font-family:Consolas,'Courier New',monospace;letter-spacing:.4px}.ln{opacity:0;animation:show 16s linear infinite}.type{animation:type 16s steps(44,end) infinite}.cur{animation:blink 1s steps(1) infinite}.l2{animation-delay:2.2s}.l3{animation-delay:3.4s}.l4{animation-delay:6.2s}.l5{animation-delay:7.4s}.l6{animation-delay:9.2s}.l7{animation-delay:10.4s}@keyframes show{0%{opacity:0}2%{opacity:1}74%{opacity:1}78%,100%{opacity:0}}@keyframes type{0%{transform:translateX(0)}12%,100%{transform:translateX(760px)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.ln{opacity:1;animation:none}.type,.cur{animation:none}.type{display:none}}</style><rect width="1200" height="470" rx="20" fill="#101820"/><rect x="760" y="20" width="420" height="80" fill="url(#dots)"/><text class="m" x="40" y="45" font-size="15" fill="#83d8d0" letter-spacing="1.3">03 / FIELD WORK</text><text class="m" x="1160" y="45" font-size="13" fill="#efb67c" letter-spacing="1.3" text-anchor="end">LIVE RUN · TRACELEAKCHECK</text><text x="40" y="96" font-size="38" fill="#edf1ed" font-weight="700">Catching secrets before they ship.</text><rect x="40" y="128" width="1120" height="306" rx="14" fill="#0b1218" stroke="#30424e"/><path d="M40 168L1160 168" stroke="#30424e"/><circle cx="66" cy="148" r="6" fill="#30424e"/><circle cx="88" cy="148" r="6" fill="#30424e"/><circle cx="110" cy="148" r="6" fill="#30424e"/><text class="m" x="600" y="153" font-size="13" fill="#adbdc6" text-anchor="middle">~/lab — bash</text><g font-size="17" class="m"><g class="ln l1" style="opacity:1;animation:none"><text x="66" y="206"><tspan fill="#83d8d0">$</tspan><tspan fill="#edf1ed"> traceleakcheck run --secret OPENAI_API_KEY -- node agent.js</tspan></text><rect class="type" x="84" y="188" width="780" height="26" fill="#0b1218"/></g><text class="ln l2" x="84" y="240" fill="#adbdc6">planted a fake key · watching traces, logs and metrics…</text><g class="ln l3"><rect x="84" y="254" width="146" height="26" rx="5" fill="#3a1f20"/><text x="96" y="273" fill="#ef8a7a" font-weight="700">✖ LEAK FOUND</text><text x="244" y="273" fill="#edf1ed">OpenAI key leaked in <tspan fill="#ef8a7a" font-weight="700">15 places</tspan><tspan fill="#adbdc6"> · error message · logs · metrics</tspan></text></g><text class="ln l4" x="66" y="318"><tspan fill="#83d8d0">$</tspan><tspan fill="#edf1ed"> # same app, through the redaction Collector</tspan></text><text class="ln l5" x="66" y="352"><tspan fill="#83d8d0">$</tspan><tspan fill="#edf1ed"> traceleakcheck run --app-endpoint collector:4318 -- node agent.js</tspan></text><g class="ln l6"><rect x="84" y="368" width="98" height="26" rx="5" fill="#16302e"/><text x="96" y="387" fill="#83d8d0" font-weight="700">✔ CLEAN</text><text x="196" y="387" fill="#edf1ed">secrets stayed out of the monitoring data</text></g><g class="ln l7"><text x="66" y="420" fill="#83d8d0">$</text><rect class="cur" x="84" y="406" width="10" height="18" fill="#efb67c"/></g></g></svg>
