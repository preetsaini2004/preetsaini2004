<svg xmlns="http://www.w3.org/2000/svg" width="600" height="790" viewBox="0 0 600 790" role="img" aria-labelledby="title"><title id="title">Shipped and reported. TraceLeakCheck: an open-source tool that catches secrets leaking through an AI app's OpenTelemetry. Reported OpenTelemetry bug opentelemetry-python-contrib #5279: S3 presigned URLs leaked their signature and session token into traces.</title><style>text{font-family:Arial,Helvetica,sans-serif}.m,.m text{font-family:Consolas,'Courier New',monospace;letter-spacing:1.3px}.breathe{animation:breathe 6s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.breathe{animation:none}}</style><rect width="600" height="790" rx="20" fill="#101820"/><text class="m" x="40" y="45" font-size="15" fill="#83d8d0">04 / SHIPPED &amp; REPORTED</text><text x="40" y="95" font-size="34" fill="#edf1ed" font-weight="700">Built it. Used it.</text><text x="40" y="135" font-size="32" fill="#83d8d0" font-family="Georgia,serif" font-style="italic">Found a real bug.</text><rect x="40" y="166" width="520" height="300" rx="16" fill="#16222c" stroke="#30424e"/><text class="m" x="64" y="202" font-size="13" fill="#efb67c">FEATURED BUILD</text><text class="m" x="536" y="202" font-size="12" fill="#adbdc6" text-anchor="end">PYTHON · PYPI</text><text x="64" y="248" font-size="32" fill="#edf1ed" font-weight="700">TraceLeakCheck</text><text x="64" y="282" font-size="17" fill="#adbdc6">Plants a fake secret in your AI app,</text><text x="64" y="306" font-size="17" fill="#adbdc6">captures everything it exports, and</text><text x="64" y="330" font-size="17" fill="#adbdc6">shows exactly where the secret leaked.</text><g class="m" font-size="14"><rect x="64" y="354" width="98" height="32" rx="16" fill="#101820" stroke="#83d8d0" stroke-opacity=".6"/><text x="113" y="375" fill="#83d8d0" text-anchor="middle">FIND</text><rect x="174" y="354" width="90" height="32" rx="16" fill="#101820" stroke="#83d8d0" stroke-opacity=".6"/><text x="219" y="375" fill="#83d8d0" text-anchor="middle">FIX</text><rect x="276" y="354" width="108" height="32" rx="16" fill="#101820" stroke="#83d8d0" stroke-opacity=".6"/><text x="330" y="375" fill="#83d8d0" text-anchor="middle">PROVE</text></g><text class="m" x="64" y="432" font-size="14" fill="#edf1ed">$ pip install traceleakcheck</text><rect x="40" y="490" width="520" height="262" rx="16" fill="#16222c" stroke="#30424e"/><circle class="breathe" cx="530" cy="521" r="6" fill="#ef8a7a"/><text class="m" x="64" y="526" font-size="13" fill="#efb67c">FOUND &amp; REPORTED</text><text class="m" x="64" y="568" font-size="16" fill="#83d8d0">opentelemetry-python-contrib</text><text x="64" y="608" font-size="32" fill="#edf1ed" font-weight="700">#5279</text><text x="64" y="644" font-size="17" fill="#adbdc6">S3 presigned URLs leaked their signature</text><text x="64" y="668" font-size="17" fill="#adbdc6">and session token into traces: three</text><text x="64" y="692" font-size="17" fill="#adbdc6">X-Amz keys missing from the redaction list.</text><text class="m" x="64" y="728" font-size="13" fill="#edf1ed">FOUND WITH MY OWN TOOL ↗</text></svg>
